# Rebuild + redeploy every 6 hours with fresh YouTube videos (and eBay listings when keys exist).
# Repo secrets needed: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID. Optional: EBAY_APP_ID, EBAY_CERT_ID.
name: refresh-and-deploy
on:
  schedule: [{ cron: "17 */6 * * *" }]
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sync-youtube.mjs
      - run: node scripts/sync-ebay.mjs
        env: { EBAY_APP_ID: "${{ secrets.EBAY_APP_ID }}", EBAY_CERT_ID: "${{ secrets.EBAY_CERT_ID }}" }
      - run: npm test
      - run: node build.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "otr-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/data && (git diff --cached --quiet || git commit -m "chore: refresh data" && git push) || true
      - run: npx --yes wrangler@3 pages deploy dist --project-name off-the-rip
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
