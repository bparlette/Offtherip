name: Daily sync

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install yt-dlp
        run: pip install yt-dlp
      - name: Sync YouTube videos
        run: node scripts/sync-youtube.mjs
        continue-on-error: true
      - name: Sync eBay listings
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: node scripts/sync-ebay.mjs
        continue-on-error: true
      - name: Sync video previews
        run: node scripts/sync-video-previews.mjs --max 3
        continue-on-error: true
      - name: Sync verdict prices
        env:
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
        run: node scripts/sync-verdict-prices.mjs
        continue-on-error: true
      - name: Sync VERDICTS.md to JSON
        run: node scripts/sync-verdicts-md.mjs --from-md
        continue-on-error: true
      - name: Write auto-prices back to VERDICTS.md
        run: node scripts/sync-verdicts-md.mjs --to-md
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ VERDICTS.md
          git diff --staged --quiet || git commit -m "chore: daily auto-sync $(date +%Y-%m-%d)"
          git push
